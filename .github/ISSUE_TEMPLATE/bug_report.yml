name: Bug report
description: Something behaves differently from what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste tokens, secret values or a real `zc-care.yaml`.**
        Replace paths and names with placeholders. If a
        credential of yours has been exposed, rotate it first — see
        [SECURITY.md](../blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: zc-care version
      description: Output of `zc-care version`.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [localdir, several, not provider specific]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the `plan` or `apply` output, with names redacted.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and where the docs say so
      description: A link to the documentation or a quote from it helps a great deal.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal config that reproduces it
      description: Redacted. The smallest file that still shows the problem.
      render: yaml
