colourful: true

filekinds:
  normal: {foreground: "#f3f5f7"}
  directory: {foreground: "#3d7bff"}
  symlink: {foreground: "#9cc3ff"}
  pipe: {foreground: "#d3d8de"}
  block_device: {foreground: "#ff9a9d"}
  char_device: {foreground: "#ff9a9d"}
  socket: {foreground: "#d3d8de"}
  special: {foreground: "#3d7bff"}
  executable: {foreground: "#5fd38a"}
  mount_point: {foreground: "#5fd3c6"}

perms:
  user_read: {foreground: "#ff7a7e", is_bold: true}
  user_write: {foreground: "#ffd27a", is_bold: true}
  user_execute_file: {foreground: "#5fd38a", is_bold: true}
  user_execute_other: {foreground: "#5fd38a", is_bold: true}
  group_read: {foreground: "#ff7a7e"}
  group_write: {foreground: "#ffd27a"}
