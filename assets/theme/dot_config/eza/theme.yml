links:
  normal: {foreground: "#9cc3ff"}
  multi_link_file: {foreground: "#9cc3ff"}

git:
  new: {foreground: "#5fd38a"}
  modified: {foreground: "#ffd27a"}
  deleted: {foreground: "#ff9a9d"}
  renamed: {foreground: "#5fd3c6"}
  typechange: {foreground: "#ff8fc8"}
  ignored: {foreground: "#9aa2ad"}
  conflicted: {foreground: "#f5b44a"}

