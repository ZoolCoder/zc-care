  special_user_file: {foreground: "#3d7bff"}
  special_other: {foreground: "#9aa2ad"}
  attribute: {foreground: "#a9b0ba"}

size:
  major: {foreground: "#b9bfc8"}
  minor: {foreground: "#7fd4f5"}
  number_byte: {foreground: "#d3d8de"}
  number_kilo: {foreground: "#b9bfc8"}
  number_mega: {foreground: "#9cc3ff"}
  number_giga: {foreground: "#3d7bff"}
  number_huge: {foreground: "#3d7bff"}
  unit_byte: {foreground: "#b9bfc8"}
  unit_kilo: {foreground: "#7fd4f5"}
  unit_mega: {foreground: "#3d7bff"}
  unit_giga: {foreground: "#3d7bff"}
  unit_huge: {foreground: "#5fd3c6"}

users:
  user_you: {foreground: "#f3f5f7"}
  user_root: {foreground: "#ff7a7e"}
  user_other: {foreground: "#ff9a9d"}
