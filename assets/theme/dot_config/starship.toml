"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 1000

# Neon HUD, like the Claude Code status line: ◢◤ caps in a blue-to-cyan gradient, dim UPPERCASE labels, bright values
# on the terminal's own background, ⟩ between groups. A group in ( ) shows only when one of its modules has something
# to say.
format = """
[◢](bold fg:accent)[◤](bold fg:blue)$os$hostname$directory\
(  [⟩](fg:surface1) $git_branch$git_state$git_status$git_metrics${custom.pr}${custom.git_age})\
(  [⟩](fg:surface1) [DEV](fg:overlay1)$package$nodejs$java$gradle$golang$python$rust$dart${custom.worker}$docker_context)\
$fill\
([T+ ](fg:overlay1)$cmd_duration  [⟩](fg:surface1) )\
$time\
$line_break\
[◥](bold fg:blue)[◣](bold fg:teal) $character"""

right_format = "$status$jobs$sudo$direnv$kubernetes$memory_usage$battery"

palette = 'zoolcoder_dark'

[fill]
symbol = " "

[os]
disabled = false
style = "fg:subtext0"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Ubuntu = "󰕈"
Debian = "󰣚"
Alpine = ""

# The machine's name, only over SSH, so a remote shell never passes for the local one.
[hostname]
ssh_only = true
ssh_symbol = "󰣀 "
style = "fg:red bold"
format = "[$ssh_symbol$hostname ]($style)"

[directory]
style = "fg:text bold"
format = "[$path]($style)[$read_only]($read_only_style)"
read_only = " 󰌾"
read_only_style = "fg:red"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋"

[git_branch]
symbol = "⎇"
format = "[$symbol](fg:accent)[ $branch](fg:accent bold)"

[git_state]
format = "[ $state( $progress_current/$progress_total)](fg:red bold)"

# Counts, not just flags: !2 ?1 ⇡1 says how much is waiting, not only that something is.
[git_status]
format = "([ $all_status$ahead_behind](fg:yellow))"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
stashed = "*${count}"
deleted = "✘${count}"
renamed = "»${count}"
conflicted = "=${count}"

[git_metrics]
disabled = false
format = "([ +$added](fg:green))([ −$deleted](fg:red))"

# The branch's open pull request and its checks, or its latest CI run: ✓ passed, ● running, ✗ failed.
# bin/prompt-pr caches gh's answer and refreshes it in the background.
[custom.pr]
require_repo = true
when = true
shell = ["sh"]
command = "prompt-pr"
format = "[ $output](fg:sky)"

# How long ago the last commit landed, e.g. 3h: a stale branch shows at a glance.
[custom.git_age]
require_repo = true
when = true
shell = ["sh"]
command = "git log -1 --format=%cr 2>/dev/null | sed -E 's/ seconds?/s/;s/ minutes?/m/;s/ hours?/h/;s/ days?/d/;s/ weeks?/w/;s/ months?/mo/;s/ years?/y/;s/,.*//;s/ ago//'"
symbol = " "
format = "[ AGE ](fg:overlay1)[$output](fg:subtext0)"

# The project's own version from package.json, pubspec.yaml, build.gradle, Cargo.toml and the like.
[package]
symbol = "󰏗 "
display_private = true
format = "[ $symbol$version](fg:peach)"

[nodejs]
symbol = " "
format = "[ $symbol($version)](fg:green)"

[java]
symbol = " "
format = "[ $symbol($version)](fg:red)"

[gradle]
symbol = " "
# Only with a version: the bare icon showed in folders that merely look like Gradle.
format = "([ $symbol$version](fg:teal))"
# Reading the wrapper's version file is instant; running Gradle to ask would not be.
recursive = false

[golang]
symbol = " "
format = "[ $symbol($version)](fg:sky)"

[python]
symbol = " "
format = "[ $symbol($version)( \\($virtualenv\\))](fg:yellow)"

[rust]
symbol = " "
format = "[ $symbol($version)](fg:peach)"

[dart]
symbol = " "
format = "[ $symbol($version)](fg:blue)"

# The Cloudflare Worker this folder deploys, read from its wrangler config; no network call.
[custom.worker]
detect_files = ["wrangler.jsonc", "wrangler.json", "wrangler.toml"]
shell = ["sh"]
command = "sed -nE 's/^[[:space:]]*\"?name\"?[[:space:]]*[:=][[:space:]]*\"([^\"]+)\".*/\\1/p' wrangler.jsonc wrangler.json wrangler.toml 2>/dev/null | head -1"
symbol = "󰅟 "
format = "[ $symbol$output](fg:peach)"

[docker_context]
symbol = " "
format = "[ $symbol$context](fg:blue)"

[cmd_duration]
min_time = 2000
show_milliseconds = false
format = "[$duration](fg:yellow)"
show_notifications = true
min_time_to_notify = 45000

[time]
disabled = false
time_format = "%R"
format = "[$time](bold fg:ice)"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
vimcmd_replace_one_symbol = "[❮](bold fg:ice)"
vimcmd_replace_symbol = "[❮](bold fg:ice)"
vimcmd_visual_symbol = "[❮](bold fg:yellow)"

[status]
disabled = false
symbol = "✗ "
# The signal's name when a command was killed (SIGINT, SIGKILL), the number otherwise.
format = "[$symbol$common_meaning$signal_name$maybe_int]($style) "
map_symbol = false
style = "bold fg:red"

[jobs]
symbol = "⚙ "
number_threshold = 1
format = "[$symbol$number]($style) "
style = "fg:peach"

[sudo]
disabled = false
symbol = " "
style = "bold fg:red"
format = "[$symbol sudo]($style) "

[direnv]
disabled = false
symbol = "󰌪 "
style = "fg:teal"
format = "[$symbol$loaded$allowed]($style) "
loaded_msg = ""
unloaded_msg = "not loaded "
allowed_msg = ""
denied_msg = "denied"
not_allowed_msg = "not allowed"

[kubernetes]
disabled = false
symbol = "☸ "
format = "[$symbol$context( · $namespace)]($style) "
style = "fg:sapphire"
detect_files = ["Chart.yaml", "kustomization.yaml", "skaffold.yaml"]
detect_folders = ["k8s", "helm", "charts"]

[memory_usage]
disabled = false
threshold = 85
symbol = "󰍛 "
style = "bold fg:peach"
format = "[$symbol$ram_pct]($style) "

[battery]
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold fg:red"

