# tmux for Ghostty and Claude Code: Ctrl+Space prefix, mouse, true colour and keys Claude needs (Shift+Enter).
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g default-terminal tmux-256color
# sync lets tmux hand Ghostty a whole screen at once, so Claude's large redraws do not flicker.
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard:hyperlinks:usstyle:sync"
set -s extended-keys on
set -s escape-time 0
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
# Lets Claude's notifications and Ghostty's own escape codes through to the terminal.
set -g allow-passthrough on
set -g set-titles on
# The Ghostty tab shows what the pane reports (the shell's folder and command, or Claude's title), after the session
# name unless the title already carries it. A pane whose program sets no title still has the host name there, and
# shows the session and window name instead.
set -g set-titles-string "#{?#{==:#{pane_title},#{host}},#S · #W,#{?#{m:*#S*,#{pane_title}},#{pane_title},#S · #{pane_title}}}"
# Claude rings the bell when it waits for you; that window is then marked in the status bar.
# The bell also reaches Ghostty from the window in view, so a session in a background tab marks its tab.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g detach-on-destroy off

# Splits and new windows open in the current pane's folder.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Alt+H/J/K/L moves between panes without the prefix (Ghostty sends Option as Alt).
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy

# Popups: lazygit, a new Claude session, and a session picker that previews what each session shows.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# A window, not a popup, so Claude keeps its own tab in the status bar.
bind a new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}" "claude --continue || claude"
bind A display-popup -E -w 90% -h 90% -d "#{pane_current_path}" claude
bind s display-popup -E -w 90% -h 80% "tmux list-sessions -F '#S' | fzf --reverse --prompt 'session> ' --preview 'tmux capture-pane -ep -t {}:' --preview-window right,70% | xargs -r tmux switch-client -t"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Status bar at the top, coloured by theme.sh: dark in Ghostty, else following light and dark mode.
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100
run-shell "~/.config/tmux/theme.sh"
